spring.application.name=todomarket-inventory
server.port=${PORT:8183}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/todomarket?serverSelectionTimeoutMS=3000}
spring.data.mongodb.auto-index-creation=true
spring.jackson.deserialization.accept-float-as-int=false
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
todomarket.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173}
